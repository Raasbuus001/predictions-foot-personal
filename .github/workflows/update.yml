name: Mise à jour du site

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h00 UTC
  workflow_dispatch:       # bouton « Run workflow »

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy
      - run: python update_data.py
      - run: python build_site.py
      - name: Enregistrer les changements
        run: |
          git config user.name "mise-a-jour-auto"
          git config user.email "actions@users.noreply.github.com"
          for f in index.html injuries.json elo_live.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Mise à jour automatique" || echo "Rien de nouveau"
          git push
